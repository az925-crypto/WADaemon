name: android-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node 20 (untuk npm ci nodejs-project)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nodejs-project/package-lock.json

      - name: Install dependensi Node bridge
        working-directory: nodejs-project
        run: npm ci --omit=dev

      - name: Unduh libnode prebuilt (nodejs-mobile v18.20.4)
        run: |
          curl -sL -o /tmp/libnode.zip https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip
          rm -rf app/libnode/bin app/libnode/include
          mkdir -p app/libnode
          unzip -q /tmp/libnode.zip -d /tmp/libnode
          mv /tmp/libnode/bin /tmp/libnode/include app/libnode/
          ls app/libnode/bin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Restore keystore rilis (dari secrets, tidak di-commit)
        env:
          KEYSTORE_BASE64: ${{ secrets.WADAEMON_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/wadaemon-release.jks
          chmod 600 /tmp/wadaemon-release.jks
          ls -l /tmp/wadaemon-release.jks

      - name: Build release APK
        uses: gradle/gradle-build-action@v3
        env:
          WADAEMON_KEYSTORE_PATH: /tmp/wadaemon-release.jks
          WADAEMON_STORE_PASSWORD: ${{ secrets.WADAEMON_STORE_PASSWORD }}
          WADAEMON_KEY_ALIAS: ${{ secrets.WADAEMON_KEY_ALIAS }}
          WADAEMON_KEY_PASSWORD: ${{ secrets.WADAEMON_KEY_PASSWORD }}
        with:
          gradle-version: "8.7"
          arguments: assembleRelease --no-daemon

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
